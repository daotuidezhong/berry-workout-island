name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-data-migration, codex/orange-focus-update, codex/next-update-v0.9.9]

jobs:
  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:mac -- --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-macOS-${{ matrix.arch }}
          path: outputs/*.dmg
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config desktop/vite.config.ts
      - run: npx --yes electron-builder@26.0.12 --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-Windows-x64
          path: |
            outputs/*.exe
            outputs/*.blockmap
            outputs/latest.yml
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release view "v${version}" >/dev/null 2>&1 || gh release create "v${version}" --target "$GITHUB_SHA" --title "OH v${version}" --latest --notes $'新增墙上生活照片板，支持照片原比例浏览、说明编辑、横向滚动和高清大图查看；墙上缩略图会按横图、竖图与方图自然混排，不拉伸也不溢出木框。\n\n照片说明会随网页存档、Electron 本地存档及 .ohbackup 一起保存和迁移；今日记录中的旧照片入口已经移除。\n\n底部 Dock 保留原版布局，并优化记录、背包等按钮的像素 Hover 动效。\n\n安装说明：Windows 使用 Setup EXE；Apple 芯片 Mac 使用 arm64 DMG；Intel Mac 使用 x64 DMG。当前安装包未进行商业代码签名或 Apple 公证，首次运行可能需要在系统安全设置中确认。'
          gh release upload "v${version}" release-assets/* --clobber
