name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-data-migration, codex/orange-focus-update]

jobs:
  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:mac -- --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-macOS-${{ matrix.arch }}
          path: outputs/*.dmg
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config desktop/vite.config.ts
      - run: npx --yes electron-builder@26.0.12 --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-Windows-x64
          path: |
            outputs/*.exe
            outputs/*.blockmap
            outputs/latest.yml
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release view "v${version}" >/dev/null 2>&1 || gh release create "v${version}" --target "$GITHUB_SHA" --title "OH v${version}" --latest --notes $'橙子专注小窗升级为苹果风液态玻璃外观，中央保持高透明，仅保留细进度环，尽量不遮挡屏幕内容。\n\n小窗固定为 160×160，并移除右下角缩放控件和正方形系统边框。拖动改为锁定内容区，计时文字的位置与字号在拖动过程中保持不变。\n\n安装说明：Windows 使用 Setup EXE；Apple 芯片 Mac 使用 arm64 DMG；Intel Mac 使用 x64 DMG。当前安装包未进行商业代码签名或 Apple 公证，首次运行可能需要在系统安全设置中确认。'
          gh release upload "v${version}" release-assets/* --clobber
