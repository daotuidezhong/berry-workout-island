name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-data-migration, codex/orange-focus-update]

jobs:
  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:mac -- --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-macOS-${{ matrix.arch }}
          path: outputs/*.dmg
          if-no-files-found: error

  build-windows:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config desktop/vite.config.ts
      - run: npx --yes electron-builder@26.0.12 --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OH-Windows-x64
          path: |
            outputs/*.exe
            outputs/*.blockmap
            outputs/latest.yml
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release view "v${version}" >/dev/null 2>&1 || gh release create "v${version}" --target "$GITHUB_SHA" --title "OH v${version}" --latest --notes $'主界面升级为更轻盈的半透明信息层，并保留原版彩色图标风格；房间标题更新为 OH，天气会实时同步，晴朗夜晚显示月亮。\n\n唱片机新增 Jordan Critz《Beauté》本地音频，网络版本无法播放时也能正常收听。\n\n桌面安装包移除了约 926 MB 已停用的唱片动画帧，Windows 安装包由约 1.40 GB 降至约 478 MB，并继续支持差分自动更新。\n\n安装说明：Windows 使用 Setup EXE；Apple 芯片 Mac 使用 arm64 DMG；Intel Mac 使用 x64 DMG。当前安装包未进行商业代码签名或 Apple 公证，首次运行可能需要在系统安全设置中确认。'
          gh release upload "v${version}" release-assets/* --clobber
